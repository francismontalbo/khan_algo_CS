name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  algorithms:
    name: Site and algorithm checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install algorithm test dependency
        run: python -m pip install -r requirements-dev.txt
      - name: Check the shipped checksum manifest
        run: python tools/check_manifest.py
      - name: Check packaged pages and local links
        run: python tools/check_site.py --out output/ci/static-checks.json
      - name: Check embedded assets match editable sources
        run: python tools/sync_assets.py --check
      - name: Verify algorithms and artifact integrity
        run: python verify.py
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: algorithm-check-reports
          path: |
            output/ci/static-checks.json
            tests/final/*.json
            tests/algorithm_lessons/*.json
            tests/simulations/Algorithm_Validation.json
            tests/applications/Example_Results.json
          if-no-files-found: warn

  browser:
    name: Chromium browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-browser.txt
      - name: Install browser test dependency
        run: python -m pip install -r requirements-browser.txt
      - name: Install Chromium and its system dependencies
        run: python -m playwright install --with-deps chromium
      - name: Run browser smoke checks
        run: python tools/check_browser.py --require-http --out output/ci/browser-checks.json
      - name: Verify equation typesetting and offline exports
        run: python tools/check_math.py --out output/ci/math-checks.json
      - name: Upload browser report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-check-report
          path: |
            output/ci/browser-checks.json
            output/ci/math-checks.json
          if-no-files-found: warn
